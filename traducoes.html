<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Todas as Traduções | GamePTBR</title>

<link rel="icon" type="image/png" href="image.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#090909;
    color:#fff;
}

a{
    text-decoration:none;
    color:inherit;
}

/* CABEÇALHO */

header{
    background:#171717;
    border-bottom:2px solid #ed1c24;
}

.header-content{
    width:min(1080px,90%);
    margin:auto;
    min-height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.logo{
    font-size:32px;
    font-weight:800;
}

.logo span{
    color:#ed1c24;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    font-weight:bold;
}

nav a:hover{
    color:#ed1c24;
}

/* CONTEÚDO */

.container{
    width:min(1080px,90%);
    margin:auto;
    padding:45px 0 70px;
}

.page-title{
    font-size:34px;
    margin-bottom:8px;
}

.page-title span{
    color:#ed1c24;
}

.subtitle{
    color:#bcbcbc;
    margin-bottom:32px;
}

/* BUSCA */

.search-area{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search-area input{
    width:100%;
    background:#171717;
    border:1px solid #333;
    border-radius:7px;
    padding:14px 16px;
    font-size:16px;
    color:#fff;
    outline:none;
}

.search-area input:focus{
    border-color:#ed1c24;
}

/* ALFABETO */

.alphabet{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:35px;
}

.alphabet button{
    background:#171717;
    color:#ddd;
    border:1px solid #333;
    border-radius:5px;
    padding:7px 10px;
    cursor:pointer;
    font-weight:bold;
}

.alphabet button:hover,
.alphabet button.active{
    background:#ed1c24;
    border-color:#ed1c24;
    color:#fff;
}

/* CONTADOR */

.results-info{
    margin-bottom:18px;
    color:#aaa;
    font-size:14px;
}

/* LISTA */

.translation-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.translation-item{
    background:#151515;
    border:1px solid #292929;
    border-radius:10px;
    overflow:hidden;

    display:grid;
    grid-template-columns:110px 1fr auto;
    align-items:center;

    transition:.2s;
}

.translation-item:hover{
    border-color:#ed1c24;
    transform:translateY(-1px);
}

.translation-image{
    width:110px;
    height:100px;
    object-fit:cover;
    display:block;
}

.translation-content{
    padding:14px 20px;
}

.translation-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:7px;
}

.translation-meta{
    color:#aaa;
    font-size:14px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.status{
    color:#ff4d54;
}

.translation-action{
    padding:20px;
}

.translation-action a{
    background:#ed1c24;
    color:#fff;
    display:inline-block;
    padding:11px 16px;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
}

.translation-action a:hover{
    background:#ff3038;
}

/* LETRA */

.letter-title{
    font-size:25px;
    margin:25px 0 10px;
    color:#fff;
    border-bottom:2px solid #ed1c24;
    padding-bottom:7px;
}

/* NENHUM RESULTADO */

.no-results{
    background:#151515;
    border:1px solid #292929;
    border-radius:10px;
    padding:30px;
    text-align:center;
    color:#aaa;
}

/* RODAPÉ */

footer{
    border-top:1px solid #252525;
    text-align:center;
    padding:28px;
    color:#888;
}

/* MOBILE */

@media(max-width:700px){

    .header-content{
        flex-direction:column;
        justify-content:center;
        padding:18px 0;
    }

    nav{
        gap:18px;
    }

    .translation-item{
        grid-template-columns:80px 1fr;
    }

    .translation-image{
        width:80px;
        height:90px;
    }

    .translation-action{
        grid-column:1 / -1;
        padding:0 15px 15px;
    }

    .translation-action a{
        width:100%;
        text-align:center;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-content">

        <a href="index.html" class="logo">
            Game<span>PTBR</span>
        </a>

        <nav>
            <a href="index.html">Início</a>
            <a href="traducoes.html">Traduções</a>
            <a href="index.html#sobre">Sobre</a>
        </nav>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        Todas as <span>Traduções</span>
    </h1>

    <p class="subtitle">
        Encontre traduções de jogos para Português do Brasil.
    </p>

    <div class="search-area">

        <input
            type="search"
            id="searchInput"
            placeholder="Pesquisar jogo..."
            autocomplete="off"
        >

    </div>

    <div class="alphabet" id="alphabet">

        <button data-letter="TODOS" class="active">Todos</button>
        <button data-letter="A">A</button>
        <button data-letter="B">B</button>
        <button data-letter="C">C</button>
        <button data-letter="D">D</button>
        <button data-letter="E">E</button>
        <button data-letter="F">F</button>
        <button data-letter="G">G</button>
        <button data-letter="H">H</button>
        <button data-letter="I">I</button>
        <button data-letter="J">J</button>
        <button data-letter="K">K</button>
        <button data-letter="L">L</button>
        <button data-letter="M">M</button>
        <button data-letter="N">N</button>
        <button data-letter="O">O</button>
        <button data-letter="P">P</button>
        <button data-letter="Q">Q</button>
        <button data-letter="R">R</button>
        <button data-letter="S">S</button>
        <button data-letter="T">T</button>
        <button data-letter="U">U</button>
        <button data-letter="V">V</button>
        <button data-letter="W">W</button>
        <button data-letter="X">X</button>
        <button data-letter="Y">Y</button>
        <button data-letter="Z">Z</button>

    </div>

    <div class="results-info" id="resultsInfo"></div>

    <div class="translation-list" id="translationList"></div>

</main>


<footer>
    GamePTBR © 2026
</footer>


<script src="traducoes.js"></script>

<script>

const lista = document.getElementById("translationList");
const pesquisa = document.getElementById("searchInput");
const resultados = document.getElementById("resultsInfo");
const botoes = document.querySelectorAll("#alphabet button");

let letraSelecionada = "TODOS";

function removerAcentos(texto){

    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

}

function renderizar(){

    const termo = removerAcentos(pesquisa.value.trim());

    let filtradas = [...traducoes];

    filtradas = filtradas.filter(item => {

        const nome = removerAcentos(item.nome);

        const correspondePesquisa =
            nome.includes(termo);

        const correspondeLetra =
            letraSelecionada === "TODOS" ||
            nome.toUpperCase().startsWith(
                letraSelecionada.toLowerCase()
            );

        return correspondePesquisa && correspondeLetra;

    });

    filtradas.sort((a,b) =>
        a.nome.localeCompare(b.nome, "pt-BR")
    );

    resultados.textContent =
        filtradas.length +
        (filtradas.length === 1
            ? " tradução encontrada"
            : " traduções encontradas");

    lista.innerHTML = "";

    if(filtradas.length === 0){

        lista.innerHTML = `
            <div class="no-results">
                Nenhuma tradução encontrada.
            </div>
        `;

        return;
    }

    let letraAtual = "";

    filtradas.forEach(item => {

        const primeiraLetra =
            item.nome.charAt(0).toUpperCase();

        if(primeiraLetra !== letraAtual){

            letraAtual = primeiraLetra;

            const titulo = document.createElement("div");
            titulo.className = "letter-title";
            titulo.textContent = letraAtual;

            lista.appendChild(titulo);

        }

        const card = document.createElement("article");

        card.className = "translation-item";

        card.innerHTML = `

            <img
                class="translation-image"
                src="${item.imagem}"
                alt="${item.nome}"
            >

            <div class="translation-content">

                <div class="translation-name">
                    ${item.nome}
                </div>

                <div class="translation-meta">

                    <span>${item.plataforma}</span>

                    <span>${item.idioma}</span>

                    <span>${item.versao}</span>

                    <span>${item.tamanho}</span>

                    <span class="status">
                        ${item.status}
                    </span>

                </div>

            </div>

            <div class="translation-action">

                <a href="${item.pagina}">
                    VER TRADUÇÃO
                </a>

            </div>

        `;

        lista.appendChild(card);

    });

}

pesquisa.addEventListener("input", renderizar);

botoes.forEach(botao => {

    botao.addEventListener("click", () => {

        letraSelecionada = botao.dataset.letter;

        botoes.forEach(b =>
            b.classList.remove("active")
        );

        botao.classList.add("active");

        renderizar();

    });

});

renderizar();

</script>

</body>
</html>
